[project]
name = "b-cube-sexyit-crawl"
version = "1.0.0"
description = "Daily Instagram crawler that stores new posts to Cloudflare R2 and MongoDB"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "instagrapi>=3.2.2",
    "pymongo>=4.10",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
